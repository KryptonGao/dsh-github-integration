<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">dsh-github-integration</title>
  <desc id="desc">A DeepSeek Harness workspace plugin that connects local Git changes and GitHub issues, pull requests, and repository actions.</desc>

  <rect width="1200" height="420" rx="28" fill="#10131A"/>
  <path d="M48 342H1152" stroke="#303746" stroke-width="2"/>
  <path d="M48 76H1152" stroke="#252B36" stroke-width="1"/>
  <path d="M48 76V342M1152 76V342" stroke="#252B36" stroke-width="1"/>

  <g id="title-block" transform="translate(72 58)">
    <text x="0" y="22" fill="#9AA4B2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">DEEPSEEK HARNESS / PLUGIN</text>
    <text x="0" y="92" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="52" font-weight="720" letter-spacing="-1.5">dsh-github-</text>
    <text x="0" y="148" fill="#8B93FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="52" font-weight="720" letter-spacing="-1.5">integration</text>
    <text x="0" y="198" fill="#D8DDE6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22">GitHub 就在你的 Workspace 里。</text>
    <text x="0" y="238" fill="#8F99A8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="19">Issues · Pull requests · local changes</text>
    <g transform="translate(0 250)">
      <rect width="162" height="38" rx="19" fill="#202633" stroke="#3A4353"/>
      <text x="81" y="25" text-anchor="middle" fill="#D8DDE6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">workspace-scoped</text>
      <rect x="176" width="120" height="38" rx="19" fill="#202633" stroke="#3A4353"/>
      <text x="236" y="25" text-anchor="middle" fill="#D8DDE6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">TypeScript</text>
    </g>
  </g>

  <g id="project-flow" transform="translate(690 98)">

      <text x="148" y="33" fill="#D8DDE6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">Pull requests</text>
      <path d="M284 18V36" stroke="#303746"/>
      <circle cx="308" cy="27" r="5" fill="#F0B76B"/>
      <text x="326" y="33" fill="#D8DDE6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">Changes</text>

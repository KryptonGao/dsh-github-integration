      <path d="M29 18C20 18 14 24 14 32C14 38 18 42 23 44C25 44 26 43 26 41V37H22C20 37 19 36 19 34C19 32 20 31 22 31H26V28C26 26 28 25 30 25C32 25 34 26 34 28V31H38C40 31 41 32 41 34C41 36 40 37 38 37H34V41C34 43 35 44 37 44C42 42 44 38 44 32C44 24 38 18 29 18Z" fill="#F0B76B"/>

      <circle cx="22" cy="22" r="7" fill="#8B93FF"/>
      <text x="40" y="27" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="650">Workspace</text>
      <text x="16" y="49" fill="#9AA4B2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">origin</text>
    </g>

    <path d="M152 89H182" stroke="#8B93FF" stroke-width="3"/>
    <path d="M174 81L184 89L174 97" fill="none" stroke="#8B93FF" stroke-width="3"/>

